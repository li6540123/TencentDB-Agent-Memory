# 机器可读：本次发版需合并的环境变量与镜像
# 部署方可 yq 解析后 merge 进自有模板；secret: true 表示应由 Secret 管理，勿提交明文

version: "2026-08-24-per-sk-mem-and-http-git"
git_ref:
  branch: feat/per-sk-mem-and-http-git
  commit: "2f96266" # 发版时改为实际 commit

images:
  memory-core:
    example: tdai-local/memory-core:per-sk-mem-and-http-git
    required_for: [per-sk-mem]
  memory-proxy:
    example: tdai-local/memory-proxy:per-sk-mem-and-http-git
    required_for: [per-sk-mem]
  memory-hub:
    example: tdai-local/memory-hub:per-sk-mem-and-http-git
    required_for: [per-sk-mem, http-git]

env_add:
  memory-core:
    - name: TDAI_MAAS_KEY_SECRET
      required: true
      secret: true
      min_length: 32
      description: AES-256-GCM 主密钥，加密每把 sk-mem 绑定的 MaaS API Key
      generate: "openssl rand -base64 32"

  memory-proxy:
    - name: PROXY_MAAS_KEY_CACHE_TTL_MS
      required: false
      default: "60000"
      description: Core resolve 结果内存缓存 TTL（毫秒）
    - name: PROXY_MAAS_KEY_RESOLVE_TIMEOUT_MS
      required: false
      default: "1500"
      description: 调 Core /v3/internal/meta/user-key/maas-key/resolve 超时（毫秒）

  memory-hub:
    - name: VITE_PROXY_MAAS_KEY_CACHE_TTL_MS
      required: false
      default: "60000"
      description: Hub 前端 MaaS 保存成功提示；须与 PROXY_MAAS_KEY_CACHE_TTL_MS 一致
      must_match_env: PROXY_MAAS_KEY_CACHE_TTL_MS
    - name: KNOWLEDGE_ALLOW_HTTP
      required: false
      default: "0"
      truthy_values: ["1", "true", "on", "yes"]
      description: 为 1 时 CodeGraph 允许 http:// 仓库
    - name: KNOWLEDGE_GIT_TOKEN
      required: false
      secret: true
      description: 内网 Git HTTP Basic 密码（PAT）；clone/sync 时临时嵌入 URL，不落盘
    - name: KNOWLEDGE_GIT_USERNAME
      required: false
      default: jenkins
      description: KNOWLEDGE_GIT_TOKEN 对应的 Basic Auth 用户名
    - name: KNOWLEDGE_SSRF_CHECK
      required: false
      default: "on"
      disable_values: ["off", "false", "0", "no"]
      description: 内网 IP 仓库时设为 off

env_unchanged_but_required:
  memory-proxy:
    - PROXY_CORE_SERVICE_TOKEN
    - PROXY_UPSTREAM_URL
    - PROXY_UPSTREAM_API_KEY

db_migrations:
  - id: meta_user_key_maas_credentials
    engines: [sqlite, mongodb]
    auto_on_core_start: true
    destructive: false
    manual_scripts:
      sqlite_scan: MemoryCore/scripts/db/migrate-per-sk-mem-maas.mjs
      sqlite_file: MemoryCore/scripts/db/migrate-per-sk-mem-maas-sqlite.sql
      mongodb: MemoryCore/scripts/db/migrate-per-sk-mem-maas-mongo.js
      wrapper: deploy/internal-team/init-per-sk-mem-maas.sh

post_deploy_manual:
  - Hub API Keys 页为每把 sk-mem 配置 MaaS API Key（非 env）
  - HTTP Git 时在 Panel 填写 http:// 仓库地址

verify:
  - deploy/internal-team/verify-maas-proxy.sh
  - deploy/internal-team/init-per-sk-mem-maas.sh --verify-only
