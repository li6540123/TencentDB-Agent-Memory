# 机器可读：本次发版需合并的环境变量与镜像
# 部署方可 yq 解析后 merge 进自有模板

version: "20688f9-amd64"
release_date: "2026-08-24"
git_ref:
  branch: feat/per-sk-mem-and-http-git
  commit: "1ac6058"

# 本次离线包 tdai-images-20688f9-amd64.tgz 内的镜像
images:
  memory-core: tdai-local/memory-core:20688f9-amd64
  memory-proxy: tdai-local/memory-proxy:20688f9-amd64
  memory-hub: tdai-local/memory-hub:20688f9-amd64

# 相对官方版，本次新增的能力（给人读）
features:
  - id: per-sk-mem-maas-key
    summary: 每把 sk-mem 在 Hub 绑定独立 MaaS API Key
    images: [memory-core, memory-proxy, memory-hub]
  - id: http-git-codegraph
    summary: CodeGraph 支持 http:// 内网仓库 + 环境变量注入 Git token
    images: [memory-hub]
  - id: fix-embedding-send-dimensions
    summary: 修复 L0/L1 写入路径 sendDimensions 遗漏导致 Qwen3 向量全失败
    images: [memory-core]

env_add:
  memory-core:
    - name: TDAI_MAAS_KEY_SECRET
      required: true
      secret: true
      min_length: 32
      feature: per-sk-mem-maas-key
      generate: "openssl rand -base64 32"
    - name: embedding.sendDimensions
      required: false
      recommended: "false"
      feature: fix-embedding-send-dimensions
      note: Qwen3/BGE-M3 必须 false；写入与搜索路径现已一致

  memory-proxy:
    - name: PROXY_MAAS_KEY_CACHE_TTL_MS
      required: false
      default: "60000"
      feature: per-sk-mem-maas-key
    - name: PROXY_MAAS_KEY_RESOLVE_TIMEOUT_MS
      required: false
      default: "1500"
      feature: per-sk-mem-maas-key

  memory-hub:
    - name: VITE_PROXY_MAAS_KEY_CACHE_TTL_MS
      required: false
      default: "60000"
      feature: per-sk-mem-maas-key
      must_match_env: PROXY_MAAS_KEY_CACHE_TTL_MS
    - name: KNOWLEDGE_ALLOW_HTTP
      required: false
      default: "0"
      feature: http-git-codegraph
    - name: KNOWLEDGE_GIT_TOKEN
      required: false
      secret: true
      feature: http-git-codegraph
    - name: KNOWLEDGE_GIT_USERNAME
      required: false
      default: jenkins
      feature: http-git-codegraph
    - name: KNOWLEDGE_SSRF_CHECK
      required: false
      default: on
      feature: http-git-codegraph

db_migrations:
  - id: meta_user_key_maas_credentials
    feature: per-sk-mem-maas-key
    engines: [sqlite, mongodb]
    auto_on_core_start: true
    changes: "新增表，不修改旧表"

post_deploy_manual:
  - feature: per-sk-mem-maas-key
    action: Hub API Keys 页为每行 sk-mem 配置 MaaS API Key
  - feature: http-git-codegraph
    action: Panel 创建 CodeGraph 时填写 http:// 仓库地址
