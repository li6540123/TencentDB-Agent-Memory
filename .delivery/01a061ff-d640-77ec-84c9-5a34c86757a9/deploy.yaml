  panel_health: http://127.0.0.1:8125/health
  knowledge_health: http://127.0.0.1:8424/health
  knowledge_docs: http://127.0.0.1:8424/docs
  proxy_health: http://127.0.0.1:8096/health

health_check: |
  cd deploy/global-images && ./verify.sh --skip-llm
  for u in http://127.0.0.1:8420/health http://127.0.0.1:8125/health \
           http://127.0.0.1:8424/health http://127.0.0.1:8096/health; do
    curl -sf -o /dev/null -w "%{http_code} $u\n" "$u" | grep -q "^200 "
  done

rollback_cmd: |
  cd deploy/global-images && ./stop-all.sh

start_cmd: |
  cd deploy/global-images && ./start-all.sh

